name: Validate, build and publish plane_pymavlink

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  DEVPI_SERVER: https://stablekite.com:4438/
  DEVPI_TARGET_INDEX: https://stablekite.com:4438/StableKite/index/

jobs:
  validate:
    name: Validate package and Plane protocol
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python 3.14t
        uses: actions/setup-python@v7
        with:
          python-version: "3.14t"

      - name: Install validation dependency
        run: python -m pip install --upgrade lxml

      - name: Validate StableKite namespace and protocol definitions
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path
          import re
          import struct
          import subprocess
          import sys
          import xml.etree.ElementTree as ET

          root = Path.cwd()
          setup = (root / "setup.py").read_text(encoding="utf-8")

          required_setup_fragments = (
              "setup (name = 'plane_pymavlink',",
              "package_dir = { 'plane_pymavlink' : '.' },",
              "'plane_pymavlink.generator',",
              "'plane_pymavlink.dialects.v20',",
              'name="plane_pymavlink.dfindexer.dfindexer_cy"',
          )
          for fragment in required_setup_fragments:
              if fragment not in setup:
                  raise SystemExit(
                      f"setup.py is missing expected StableKite namespace: {fragment}"
                  )

          tracked = subprocess.check_output(
              ["git", "ls-files", "-z"],
          ).split(b"\0")

          functional_old_namespace = (
              re.compile(rb"\bfrom\s+pymavlink\b"),
              re.compile(rb"\bimport\s+pymavlink\b"),
              re.compile(rb"\bpymavlink\."),
              re.compile(rb"['\"]pymavlink['\"]"),
          )

          bad = []
          # Scan runtime/source files, not workflow/config files. The workflow
          # itself intentionally contains the old namespace as a negative-test
          # string (for example find_spec("pymavlink")).
          code_suffixes = {
              ".py", ".pyi", ".pyx", ".pxd", ".sh",
          }

          for raw_name in tracked:
              if not raw_name:
                  continue
              path = Path(raw_name.decode("utf-8"))
              if path.parts and path.parts[0] == ".github":
                  continue
              if path.suffix.lower() not in code_suffixes:
                  continue
              data = path.read_bytes()
              if any(pattern.search(data) for pattern in functional_old_namespace):
                  bad.append(str(path))

          if bad:
              raise SystemExit(
                  "Functional references to old Python namespace 'pymavlink' remain:\n"
                  + "\n".join(sorted(bad))
              )

          common_xml = root / "message_definitions/v1.0/common.xml"
          tree = ET.parse(common_xml)
          mavlink = tree.getroot()

          messages = {
              int(message.attrib["id"]): message
              for message in mavlink.findall("./messages/message")
          }

          expected = {
              3: (
                  "PLANE_TARGET_BBOX",
                  [
                      ("time_boot_ms", "uint32_t"),
                      ("shoot_time_ms", "uint32_t"),
                      ("time", "uint32_t"),
                      ("score", "float"),
                      ("left", "float"),
                      ("top", "float"),
                      ("right", "float"),
                      ("bottom", "float"),
                      ("target_id", "int8_t"),
                      ("track_id", "uint8_t"),
                  ],
                  35,
              ),
              9: (
                  "PLANE_TARGET_ID",
                  [
                      ("time_boot_ms", "uint32_t"),
                      ("target_id", "int8_t"),
                  ],
                  6,
              ),
              10: (
                  "PLANE_NO_TARGET",
                  [
                      ("time_boot_ms", "uint32_t"),
                      ("shoot_time_ms", "uint32_t"),
                  ],
                  9,
              ),
          }

          sizes = {
              "uint8_t": 1,
              "int8_t": 1,
              "uint32_t": 4,
              "float": 4,
          }

          for message_id, (name, fields, raw_size) in expected.items():
              message = messages.get(message_id)
              if message is None:
                  raise SystemExit(f"Missing {name} ({message_id})")
              if message.attrib.get("name") != name:
                  raise SystemExit(
                      f"Message {message_id} has wrong name "
                      f"{message.attrib.get('name')!r}"
                  )

              actual = [
                  (field.attrib["name"], field.attrib["type"])
                  for field in message.findall("field")
              ]
              if actual != fields:
                  raise SystemExit(
                      f"{name} fields do not match StableKite protocol:\n"
                      f"expected={fields}\nactual={actual}"
                  )

              calculated = 1 + sum(
                  sizes[field_type]
                  for _, field_type in actual
              )
              if calculated != raw_size:
                  raise SystemExit(
                      f"{name}: expected {raw_size} raw UDP bytes, "
                      f"calculated {calculated}"
                  )

          assert struct.calcsize("<BIIIfffffbB") == 35
          assert struct.calcsize("<BIb") == 6
          assert struct.calcsize("<BII") == 9

          # Validate the actual MAVLink schema/generator using the bundled,
          # StableKite-synchronised message definitions.
          sys.path.insert(0, str(root))
          from generator import mavgen, mavparse

          generated = root / ".ci-generated/common.py"
          generated.parent.mkdir(parents=True, exist_ok=True)

          opts = mavgen.Opts(
              str(generated),
              wire_protocol=mavparse.PROTOCOL_2_0,
              language="Python3",
              validate=True,
          )

          if not mavgen.mavgen(opts, [str(common_xml)]):
              raise SystemExit("MAVLink common dialect generation failed")

          generated_text = generated.read_text(encoding="utf-8")
          for marker in (
              "MAVLink_plane_target_bbox_message",
              "MAVLink_plane_target_id_message",
              "MAVLink_plane_no_target_message",
          ):
              if marker not in generated_text:
                  raise SystemExit(
                      f"Generated common dialect is missing {marker!r}"
                  )

          # Generated MAVLink dialect modules are deliberately self-contained;
          # they are package data/modules when installed under plane_pymavlink,
          # but the generated source itself does not need to spell that package
          # namespace. Validate the generated module by importing it.
          import importlib.util
          import io

          spec = importlib.util.spec_from_file_location(
              "stablekite_generated_common",
              generated,
          )
          if spec is None or spec.loader is None:
              raise SystemExit("Could not create import spec for generated common.py")

          generated_common = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(generated_common)

          bbox_cls = generated_common.MAVLink_plane_target_bbox_message
          target_cls = generated_common.MAVLink_plane_target_id_message
          no_target_cls = generated_common.MAVLink_plane_no_target_message

          assert bbox_cls.id == 3
          assert target_cls.id == 9
          assert no_target_cls.id == 10

          assert list(bbox_cls.fieldnames) == [
              "time_boot_ms",
              "shoot_time_ms",
              "time",
              "score",
              "left",
              "top",
              "right",
              "bottom",
              "target_id",
              "track_id",
          ]
          assert list(target_cls.fieldnames) == [
              "time_boot_ms",
              "target_id",
          ]
          assert list(no_target_cls.fieldnames) == [
              "time_boot_ms",
              "shoot_time_ms",
          ]

          mav = generated_common.MAVLink(io.BytesIO())
          assert bbox_cls(
              time_boot_ms=1,
              shoot_time_ms=2,
              time=3,
              score=0.9,
              left=0.1,
              top=0.2,
              right=0.8,
              bottom=0.9,
              target_id=7,
              track_id=8,
          ).pack(mav)[1] == 34
          assert target_cls(
              time_boot_ms=1,
              target_id=-1,
          ).pack(mav)[1] == 5
          # The declared MAVLink payload sizes are 34 / 5 / 8 bytes.
          # MAVLink 2 is allowed to truncate trailing zero bytes on the wire,
          # so a small uint32_t value such as shoot_time_ms=2 makes
          # PLANE_NO_TARGET serialize with mlen=5 even though its full payload
          # schema is 8 bytes. Verify both the schema size and that behavior.
          assert bbox_cls.unpacker.size == 34
          assert target_cls.unpacker.size == 5
          assert no_target_cls.unpacker.size == 8

          assert no_target_cls(
              time_boot_ms=1,
              shoot_time_ms=0x01000000,
          ).pack(mav)[1] == 8

          assert no_target_cls(
              time_boot_ms=1,
              shoot_time_ms=2,
          ).pack(mav)[1] == 5

          print("StableKite package namespace: plane_pymavlink")
          print("Raw UDP datagrams: fixed 35 / 6 / 9 bytes")
          print("MAVLink declared payloads: 34 / 5 / 8 bytes")
          print("MAVLink 2 trailing-zero truncation: verified")
          print("MAVLink v2 generation/import: OK")
          PY
  windows-package:
    name: Windows x86_64 / source package
    needs: validate
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python 3.14t
        uses: actions/setup-python@v7
        with:
          python-version: "3.14t"

      - name: Install Windows build tools
        run: >-
          python -m pip install --upgrade
          build
          setuptools
          wheel
          cython
          lxml
          twine

      - name: Build universal Windows wheel and source distribution
        shell: pwsh
        env:
          PYMAVLINK_FAST_INDEX: "0"
        run: |
          $ErrorActionPreference = "Stop"
          Remove-Item -Recurse -Force dist -ErrorAction SilentlyContinue
          python -m build --no-isolation --wheel --sdist --outdir dist
          if ($LASTEXITCODE -ne 0) { throw "Windows source build failed." }

      - name: Verify Windows-built distributions
        shell: python
        run: |
          from email.parser import BytesParser
          from email.policy import default
          from pathlib import Path
          import tarfile
          import zipfile

          version = "2.4.52"
          dist = Path("dist")
          wheels = list(dist.glob("*.whl"))
          sdists = list(dist.glob("*.tar.gz"))

          if len(wheels) != 1:
              raise SystemExit(f"Expected one Windows wheel, got {wheels}")
          if len(sdists) != 1:
              raise SystemExit(f"Expected one sdist, got {sdists}")

          wheel = wheels[0]
          sdist = sdists[0]

          expected_wheel = f"plane_pymavlink-{version}-py3-none-any.whl"
          expected_sdist = f"plane_pymavlink-{version}.tar.gz"

          if wheel.name != expected_wheel:
              raise SystemExit(
                  f"Expected universal Windows wheel {expected_wheel}, got {wheel.name}"
              )
          if sdist.name != expected_sdist:
              raise SystemExit(
                  f"Expected sdist {expected_sdist}, got {sdist.name}"
              )

          with zipfile.ZipFile(wheel) as archive:
              bad = archive.testzip()
              if bad is not None:
                  raise SystemExit(f"Corrupt wheel member: {bad}")

              names = set(archive.namelist())
              required = {
                  "plane_pymavlink/__init__.py",
                  "plane_pymavlink/generator/mavcrc.py",
                  "plane_pymavlink/dialects/v20/common.py",
                  "plane_pymavlink/dfindexer/__init__.py",
              }
              missing = sorted(required - names)
              if missing:
                  raise SystemExit(f"Wheel is missing {missing}")

              native = [
                  name for name in names
                  if name.startswith("plane_pymavlink/dfindexer/")
                  and name.lower().endswith((".pyd", ".so", ".dll"))
              ]
              if native:
                  raise SystemExit(
                      f"Windows universal wheel unexpectedly has native extension: {native}"
                  )

              metadata_name = next(
                  name for name in names
                  if name.endswith(".dist-info/METADATA")
              )
              metadata = BytesParser(policy=default).parsebytes(
                  archive.read(metadata_name)
              )

          if metadata["Version"] != version:
              raise SystemExit(
                  f"Wheel metadata version mismatch: {metadata['Version']}"
              )
          if metadata["Name"].lower().replace("-", "_") != "plane_pymavlink":
              raise SystemExit(
                  f"Unexpected distribution name: {metadata['Name']}"
              )

          with tarfile.open(sdist, "r:gz") as archive:
              names = archive.getnames()
              for suffix in (
                  "/setup.py",
                  "/pyproject.toml",
                  "/MANIFEST.in",
                  "/message_definitions/v1.0/common.xml",
                  "/generator/mavschema.xsd",
                  "/dfindexer/dfindexer_cy.pyx",
                  "/dfindexer/dfindexer.c",
              ):
                  if not any(name.endswith(suffix) for name in names):
                      raise SystemExit(f"Sdist is missing {suffix}")

          print("Windows wheel:", wheel.name)
          print("Sdist:", sdist.name)
          print("Windows packaging structure: OK")

      - name: Twine-check Windows-built distributions
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m twine check .\dist\*
          if ($LASTEXITCODE -ne 0) { throw "twine check failed." }

      - name: Extract source distribution
        id: sdist
        shell: python
        run: |
          from pathlib import Path
          import os
          import shutil
          import tarfile

          sdists = list(Path("dist").glob("*.tar.gz"))
          if len(sdists) != 1:
              raise SystemExit(f"Expected one sdist, got {sdists}")

          target = Path("sdist-check")
          if target.exists():
              shutil.rmtree(target)
          target.mkdir()

          with tarfile.open(sdists[0], "r:gz") as archive:
              archive.extractall(target)

          roots = [path for path in target.iterdir() if path.is_dir()]
          if len(roots) != 1:
              raise SystemExit(f"Expected one sdist root, got {roots}")

          root = roots[0].resolve()
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"root={root}\n")

          print("Sdist root:", root)

      - name: Rebuild universal wheel from Windows-built sdist
        shell: pwsh
        env:
          PYMAVLINK_FAST_INDEX: "0"
        run: |
          $ErrorActionPreference = "Stop"
          Remove-Item -Recurse -Force rebuilt-wheel -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path rebuilt-wheel | Out-Null

          python -m build `
            --no-isolation `
            --wheel `
            --outdir rebuilt-wheel `
            "${{ steps.sdist.outputs.root }}"

          if ($LASTEXITCODE -ne 0) {
              throw "Windows rebuild from sdist failed."
          }

      - name: Verify rebuilt Windows wheel
        shell: python
        run: |
          from pathlib import Path
          import zipfile

          wheels = list(Path("rebuilt-wheel").glob("*.whl"))
          if len(wheels) != 1:
              raise SystemExit(f"Expected one rebuilt wheel, got {wheels}")

          wheel = wheels[0]
          if wheel.name != "plane_pymavlink-2.4.52-py3-none-any.whl":
              raise SystemExit(f"Unexpected rebuilt wheel: {wheel.name}")

          with zipfile.ZipFile(wheel) as archive:
              names = set(archive.namelist())
              native = [
                  name for name in names
                  if name.startswith("plane_pymavlink/dfindexer/")
                  and name.lower().endswith((".pyd", ".so", ".dll"))
              ]
              if native:
                  raise SystemExit(
                      f"Rebuilt Windows wheel unexpectedly has native extension: {native}"
                  )

          print("Rebuilt from sdist:", wheel.name)

      - name: Install and smoke-test rebuilt Windows wheel
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $Wheels = @(
              Get-ChildItem `
                  -LiteralPath rebuilt-wheel `
                  -Filter *.whl `
                  -File
          )

          if ($Wheels.Count -ne 1) {
              throw "Expected exactly one rebuilt wheel."
          }

          python -m pip install `
            --force-reinstall `
            --no-deps `
            $Wheels[0].FullName

          if ($LASTEXITCODE -ne 0) {
              throw "Installation of rebuilt Windows wheel failed."
          }

      - name: Installed Windows wheel smoke
        shell: python
        run: |
          from importlib import metadata, util
          import io
          import sysconfig

          if sysconfig.get_config_var("Py_GIL_DISABLED") != 1:
              raise SystemExit("Expected CPython 3.14 free-threaded build")

          if util.find_spec("pymavlink") is not None:
              raise SystemExit("Old pymavlink namespace unexpectedly exists")

          import plane_pymavlink
          from plane_pymavlink import dfindexer
          from plane_pymavlink.dialects.v20 import common

          if metadata.version("plane_pymavlink") != "2.4.52":
              raise SystemExit("Installed distribution version mismatch")
          if plane_pymavlink.__version__ != "2.4.52":
              raise SystemExit("Imported package version mismatch")

          if dfindexer.available:
              raise SystemExit(
                  "Windows universal wheel unexpectedly loaded native dfindexer"
              )

          mav = common.MAVLink(io.BytesIO())
          msg = common.MAVLink_plane_target_id_message(
              time_boot_ms=1,
              target_id=-1,
          )
          if msg.pack(mav)[1] != 5:
              raise SystemExit("Plane MAVLink smoke failed")

          print("Windows installed-wheel smoke: OK")
          print("dfindexer native extension intentionally absent on Windows")

      - name: Upload Windows wheel and sdist
        uses: actions/upload-artifact@v7
        with:
          name: plane-dist-windows
          path: |
            dist/plane_pymavlink-2.4.52-py3-none-any.whl
            dist/plane_pymavlink-2.4.52.tar.gz
          if-no-files-found: error

  linux-native:
    name: ${{ matrix.target }}
    needs: windows-package

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: Linux glibc x86_64 / CPython 3.14t
            runner: ubuntu-24.04
            identifier: cp314t-manylinux_x86_64
            artifact: plane-dist-linux-glibc-x86_64
            platform: manylinux
            arch: x86_64
          - target: Linux glibc aarch64 / CPython 3.14t
            runner: ubuntu-24.04-arm
            identifier: cp314t-manylinux_aarch64
            artifact: plane-dist-linux-glibc-aarch64
            platform: manylinux
            arch: aarch64
          - target: Linux musl x86_64 / CPython 3.14t
            runner: ubuntu-24.04
            identifier: cp314t-musllinux_x86_64
            artifact: plane-dist-linux-musl-x86_64
            platform: musllinux
            arch: x86_64
          - target: Linux musl aarch64 / CPython 3.14t
            runner: ubuntu-24.04-arm
            identifier: cp314t-musllinux_aarch64
            artifact: plane-dist-linux-musl-aarch64
            platform: musllinux
            arch: aarch64

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Download Windows-built source distribution
        uses: actions/download-artifact@v8
        with:
          name: plane-dist-windows
          path: source-dist

      - name: Set up host Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install cibuildwheel
        run: python -m pip install --upgrade "cibuildwheel==4.2.1"

      - name: Locate source distribution
        id: source
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t sdists < <(
            find source-dist \
              -maxdepth 1 \
              -type f \
              -name 'plane_pymavlink-2.4.52.tar.gz' \
              -print
          )

          if [ "${#sdists[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one source distribution."
            printf '%s\n' "${sdists[@]}"
            exit 1
          fi

          printf 'sdist=%s\n' "${sdists[0]}" >> "$GITHUB_OUTPUT"

      - name: Build and test native Linux wheel
        shell: bash
        env:
          PYMAVLINK_FAST_INDEX: "1"
          CIBW_ENVIRONMENT: PYMAVLINK_FAST_INDEX=1
          CIBW_TEST_COMMAND: >-
            python -c "import sysconfig;
            assert sysconfig.get_config_var('Py_GIL_DISABLED') == 1;
            import plane_pymavlink;
            from importlib import metadata, util;
            assert metadata.version('plane_pymavlink') == '2.4.52';
            assert plane_pymavlink.__version__ == '2.4.52';
            assert util.find_spec('pymavlink') is None;
            from plane_pymavlink import dfindexer;
            assert dfindexer.available;
            import plane_pymavlink.dfindexer.dfindexer_cy as ext;
            print('Native installed-wheel smoke: OK', ext.__file__)"
        run: |
          set -euo pipefail

          rm -rf wheelhouse
          mkdir -p wheelhouse

          python -m cibuildwheel \
            --only "${{ matrix.identifier }}" \
            --output-dir wheelhouse \
            "${{ steps.source.outputs.sdist }}"

      - name: Verify native wheel
        shell: python
        env:
          EXPECTED_PLATFORM: ${{ matrix.platform }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          from email.parser import BytesParser
          from email.policy import default
          from pathlib import Path
          import os
          import zipfile

          wheels = list(Path("wheelhouse").glob("*.whl"))
          if len(wheels) != 1:
              raise SystemExit(f"Expected one native wheel, got {wheels}")

          wheel = wheels[0]
          name = wheel.name
          platform = os.environ["EXPECTED_PLATFORM"]
          arch = os.environ["EXPECTED_ARCH"]

          if not name.startswith("plane_pymavlink-2.4.52-cp314t-"):
              raise SystemExit(f"Unexpected CPython/free-threaded tag: {name}")
          if platform not in name:
              raise SystemExit(
                  f"Expected platform tag containing {platform!r}: {name}"
              )
          if arch not in name:
              raise SystemExit(
                  f"Expected architecture tag containing {arch!r}: {name}"
              )

          with zipfile.ZipFile(wheel) as archive:
              bad = archive.testzip()
              if bad is not None:
                  raise SystemExit(f"Corrupt wheel member: {bad}")

              names = set(archive.namelist())
              native = [
                  member for member in names
                  if member.startswith(
                      "plane_pymavlink/dfindexer/dfindexer_cy"
                  )
                  and member.endswith(".so")
              ]
              if len(native) != 1:
                  raise SystemExit(
                      f"Expected one native dfindexer extension, got {native}"
                  )

              metadata_name = next(
                  member for member in names
                  if member.endswith(".dist-info/METADATA")
              )
              metadata = BytesParser(policy=default).parsebytes(
                  archive.read(metadata_name)
              )

          if metadata["Version"] != "2.4.52":
              raise SystemExit(
                  f"Native wheel metadata version mismatch: {metadata['Version']}"
              )

          print("Native wheel:", name)
          print("Native dfindexer:", native[0])

      - name: Upload native Linux wheel
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish platform artifacts to devpi
    needs:
      - windows-package
      - linux-native

    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request'

    runs-on: ubuntu-24.04

    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v8
        with:
          name: plane-dist-windows
          path: dist

      - name: Download glibc x86_64 wheel
        uses: actions/download-artifact@v8
        with:
          name: plane-dist-linux-glibc-x86_64
          path: dist

      - name: Download glibc aarch64 wheel
        uses: actions/download-artifact@v8
        with:
          name: plane-dist-linux-glibc-aarch64
          path: dist

      - name: Download musl x86_64 wheel
        uses: actions/download-artifact@v8
        with:
          name: plane-dist-linux-musl-x86_64
          path: dist

      - name: Download musl aarch64 wheel
        uses: actions/download-artifact@v8
        with:
          name: plane-dist-linux-musl-aarch64
          path: dist

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Verify complete platform artifact set
        shell: python
        run: |
          from pathlib import Path
          import tarfile
          import zipfile

          dist = Path("dist")
          wheels = sorted(dist.glob("*.whl"))
          sdists = sorted(dist.glob("*.tar.gz"))

          if len(wheels) != 5:
              raise SystemExit(
                  "Expected five wheels "
                  "(Windows universal + four native Linux), "
                  f"got {[path.name for path in wheels]}"
              )
          if len(sdists) != 1:
              raise SystemExit(
                  f"Expected one sdist, got {[path.name for path in sdists]}"
              )

          expected_universal = "plane_pymavlink-2.4.52-py3-none-any.whl"
          if not any(path.name == expected_universal for path in wheels):
              raise SystemExit(f"Missing {expected_universal}")

          native = [
              path.name
              for path in wheels
              if path.name != expected_universal
          ]

          required_tokens = (
              ("cp314t", "manylinux", "x86_64"),
              ("cp314t", "manylinux", "aarch64"),
              ("cp314t", "musllinux", "x86_64"),
              ("cp314t", "musllinux", "aarch64"),
          )

          for tokens in required_tokens:
              matches = [
                  name
                  for name in native
                  if all(token in name for token in tokens)
              ]
              if len(matches) != 1:
                  raise SystemExit(
                      f"Expected one wheel matching {tokens}, got {matches}"
                  )

          if sdists[0].name != "plane_pymavlink-2.4.52.tar.gz":
              raise SystemExit(f"Unexpected sdist: {sdists[0].name}")

          for wheel in wheels:
              with zipfile.ZipFile(wheel) as archive:
                  bad = archive.testzip()
                  if bad is not None:
                      raise SystemExit(
                          f"Corrupt member {bad} in {wheel.name}"
                      )

          with tarfile.open(sdists[0], "r:gz") as archive:
              archive.getmembers()

          print("Complete devpi artifact set:")
          for path in [*wheels, *sdists]:
              print(" ", path.name)

      - name: Install verification and devpi tools
        run: >-
          python -m pip install --upgrade
          twine
          devpi-client
          devpi-tokens

      - name: Twine-check complete distribution set
        run: python -m twine check dist/*

      - name: Upload combined CI artifact
        uses: actions/upload-artifact@v7
        with:
          name: plane-pymavlink-2.4.52-dist
          path: dist/*
          if-no-files-found: error

      - name: Publish
        env:
          DEVPI_TOKEN: ${{ secrets.DEVPI_TOKEN }}
          DEVPI_CLIENTDIR: ${{ runner.temp }}/devpi-client
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${DEVPI_TOKEN:-}" ]; then
            echo "::error::DEVPI_TOKEN is not available to this repository."
            exit 1
          fi

          TOKEN_FILE="$RUNNER_TEMP/devpi-token"
          printf '%s' "$DEVPI_TOKEN" > "$TOKEN_FILE"
          chmod 600 "$TOKEN_FILE"

          cleanup() {
            rm -f "$TOKEN_FILE"
            rm -rf "$DEVPI_CLIENTDIR"
          }
          trap cleanup EXIT

          devpi use "$DEVPI_SERVER"
          devpi token-login -f "$TOKEN_FILE"
          devpi use "$DEVPI_TARGET_INDEX"
          devpi upload dist/*
